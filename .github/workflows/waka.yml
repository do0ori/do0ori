name: Profile Commit Stats

on:
  schedule:
    # Runs at 9am KST
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-commit-stats
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test statistics calculation
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Update commit time statistics
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PROFILE_USER: do0ori
          PROFILE_TIMEZONE: Asia/Seoul
        run: python .github/scripts/update_commit_stats.py
      - name: Commit README changes
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Updated with Dev Metrics"
          git push
